<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .editor-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .editor-title {
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .html-icon { background: #e34c26; color: white; }
        .css-icon { background: #1572b6; color: white; }
        .js-icon { background: #f1e05a; color: black; }

        .editor {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.1);
            color: white;
            line-height: 1.5;
            tab-size: 2;
        }

        .editor::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .preview-panel {
            flex: 1;
            background: white;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .preview-header {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            padding: 12px 20px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-icon {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .preview-iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
            background: white;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 5px;
                padding: 5px;
            }
            
            .editor {
                font-size: 12px;
                padding: 15px;
            }
            
            .controls {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                margin-bottom: 10px;
                justify-content: center;
            }
        }

        .editor:focus {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Syntax highlighting simulation */
        .editor {
            color: #f8f8f2;
            background: #2d3748;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="runCode()">▶ تشغيل الكود</button>
        <button class="btn" onclick="clearAll()">🗑 مسح الكل</button>
        <button class="btn" onclick="saveCode()">💾 حفظ</button>
    </div>

    <div class="container">
        <div class="editor-panel">
            <div class="editor-header">
                <div class="editor-title">
                    <div class="lang-icon html-icon">H</div>
                    HTML
                </div>
            </div>
            <textarea 
                class="editor" 
                id="htmlEditor" 
                placeholder="اكتب كود HTML هنا...

                </div>
            </div>

// تأثيرات تفاعلية
document.addEventListener('DOMContentLoaded', function() {
    console.log('تم تحميل الصفحة!');
    
    // إضافة تأثير hover للأزرار
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
        btn.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.1)';
        });
        
        btn.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    });
});"
                oninput="runCode()"
            ></textarea>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                <div class="preview-icon">👁</div>
                معاينة النتيجة
            </div>
            <iframe class="preview-iframe" id="preview"></iframe>
        </div>
    </div>

    <script>
        function runCode() {
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            const js = document.getElementById('jsEditor').value;
            
            const preview = document.getElementById('preview');
            
            const fullCode = `
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
                        ${css}
                    </style>
                </head>
                <body>
                    ${html}
                    <script>
                        try {
                            ${js}
                        } catch(e) {
                            console.error('JavaScript Error:', e);
                            document.body.innerHTML += '<div style="color: red; background: #ffe6e6; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid red;"><strong>خطأ في JavaScript:</strong><br>' + e.message + '</div>';
                        }
                    <\/script>
                </body>
                </html>
            `;
            
            preview.srcdoc = fullCode;
        }

        function clearAll() {
            if (confirm('هل أنت متأكد من حذف جميع الأكواد؟')) {
                document.getElementById('htmlEditor').value = '';
                document.getElementById('cssEditor').value = '';
                document.getElementById('jsEditor').value = '';
                document.getElementById('preview').srcdoc = '';
            }
        }

        function saveCode() {
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            const js = document.getElementById('jsEditor').value;
            
            const fullCode = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعي</title>
    <style>
        ${css}
    </style>
</head>
<body>
    ${html}
    <script>
        ${js}
    <\/script>
</body>
</html>`;
            
            const blob = new Blob([fullCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my-project.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // تشغيل الكود عند تحميل الصفحة
        window.addEventListener('load', function() {
            // إضافة كود افتراضي للعرض
            document.getElementById('htmlEditor').value = `<div class="welcome">
    <h1>مرحباً بك في محرر الأكواد!</h1>
    <p>ابدأ بكتابة كود HTML، CSS، و JavaScript</p>
    <button onclick="showMessage()">اضغط للترحيب</button>
</div>`;

            document.getElementById('cssEditor').value = `.welcome {
    text-align: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 50px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin: 20px;
}

h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

button {
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    color: white;
    padding: 12px 24px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
}

button:hover {
    background: white;
    color: #667eea;
    transform: translateY(-2px);
}`;

            document.getElementById('jsEditor').value = `function showMessage() {
    alert('أهلاً وسهلاً! 🎉\\nاستمتع بالبرمجة مع محرر الأكواد');
}

// إضافة تأثيرات تفاعلية
document.addEventListener('DOMContentLoaded', function() {
    console.log('تم تحميل الصفحة بنجاح! ✅');
    
    // تأثير النقر على العنوان
    const title = document.querySelector('h1');
    if (title) {
        title.addEventListener('click', function() {
            this.style.transform = 'scale(1.1)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 200);
        });
    }
});`;

            runCode();
        });
    </script>
</body>
